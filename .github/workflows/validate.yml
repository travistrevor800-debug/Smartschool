name: Validate Smartschool
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check admin-forms.js
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/create-user/index.ts
          deno check supabase/functions/complete-first-login/index.ts
